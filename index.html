 P=np;mig();resetUI();await save();PL=await plist();render();toast('Imported as a new project')}catch(e){toast('Import failed: '+e.message)}}
async function newProject(){if(PUB)return;const nm=prompt('Name your new project:','New project');if(nm===null)return;await save();stopLive();P=blankP();P.pid=uid();P.name=nm.trim()||'New project';resetUI();await save();PL=await plist();render();toast('New empty project started. Your other projects are kept under Data → My projects.')}
async function openProject(pid){if(PUB||pid==P.pid)return;await save();stopLive();const d=await DB(),q=await rq(d.transaction('k').objectStore('k').get('proj:'+pid));if(!q)return toast('Project not found.');P=q;mig();resetUI();await save();PL=await plist();render();toast('Opened “'+pn()+'”')}
async function delProject(pid){const l=PL.find(x=>x.pid==pid);if(!l||!confirm(`Delete “${l.name||'Untitled'}” and all its photos? This cannot be undone.`))return;await save();const d=await DB(),cur=pid==P.pid,q=cur?P:await rq(d.transaction('k').objectStore('k').get('proj:'+pid));
 for(const o of q.points.flatMap(p=>p.imgs))await delB(o);await rq(d.transaction('k','readwrite').objectStore('k').delete('proj:'+pid));
 if(cur){stopLive();const rest=await plist();if(rest.length){P=await rq(d.transaction('k').objectStore('k').get('proj:'+rest[0].pid))}else{P=blankP();P.pid=uid()}mig();resetUI();await save()}
 PL=await plist();render();toast('Project deleted.')}
async function clr(){if(!confirm('Remove all points and photos from THIS project? Your other projects are not affected.'))return;const pid=P.pid,nm=P.name;for(const o of allMedia())await delB(o);P=blankP();P.pid=pid;P.name=nm;await save();render()}
/* diagnostics, per-device AI data, cache */
const DG={},CK='navcache:'+location.pathname;
function diagHTML(){const L=[],tfo=window.tf;L.push('Page: '+location.protocol+'//'+(location.host||'(local)')+(window.isSecureContext?' · secure':' · NOT secure, camera may be blocked'));
 L.push('Project data: '+(DG.src?'read via '+DG.src:'not read yet')+' · '+P.points.length+' places · '+allMedia().length+' photos');L.push('Photo files: '+(DG.img||(PUB?'testing…':'n/a in builder')));
 L.push('AI engine: '+(tfo?'loaded · backend '+tfo.getBackend():'NOT loaded (needs internet)')+(MN?' · model ready':' · model NOT ready'));
 try{if(tfo)L.push('Full-precision graphics: '+(tfo.env().getBool('WEBGL_RENDER_FLOAT32_CAPABLE')?'yes':'NO (this phone uses lower precision)'))}catch(e){}
 L.push('This device vs saved AI data: '+(DG.dev||'not tested yet'));L.push('Saved AI data from cache: '+(DG.cache||'no'));L.push('Speed: '+(DG.ms?DG.ms+' ms per frame':'not measured yet'));
 L.push('Recognition brain: '+(LV&&LV.B?'active · '+LV.B.pl.length+' places':'not active'));L.push('Camera: '+(DG.cam||'not started'));return L.map(x=>'<div>'+E(x)+'</div>').join('')}
const drawDg=()=>{const e=$('#dg');if(e)e.innerHTML=diagHTML()};
async function imgTest(){const all=allMedia(),step=Math.max(1,Math.ceil(all.length/40)),smp=all.filter((_,i)=>i%step==0);let ok=0,bad=0,first='';
 await Promise.all(smp.map(o=>new Promise(r=>{const i=new Image();i.onload=()=>{ok++;r()};i.onerror=()=>{bad++;first=first||url(o);r()};i.src=url(o)})));
 DG.img=ok+' of '+smp.length+' sampled loaded'+(bad?' · '+bad+' FAILED (first: '+first+')':'');if(bad)lg(bad+' photo file(s) failed to load (first: '+first+'). Check the media folder is bundled/uploaded.','er');drawDg()}
async function devCheck(){if(!MN)return;const all=P.points.flatMap(p=>p.imgs).filter(o=>o.e&&o.m===TAG),smp=all.filter((_,i)=>i%Math.max(1,Math.floor(all.length/4))==0).slice(0,4),s=[];
 for(const o of smp){try{const im=new Image();im.src=url(o);await im.decode();const es=await embAll(im);if(es)s.push(dot(es[0],o.e))}catch(e){}}
 if(!s.length){DG.dev='could not test';return}const m=s.reduce((a,b)=>a+b,0)/s.length;DG.dev=(Math.round(m*1000)/10)+'% match ('+s.length+' photos)';lg('Device check: '+DG.dev,m<.97?'er':'ok',72);
 if(m<.97){lg('This phone computes the AI data differently from the computer that made it. Re-processing your photos on this phone…','er',72);for(const p of P.points)for(const o of p.imgs)o.m=null;await prepP();DG.dev+=' → re-processed on this phone'}drawDg()}
async function cacheLoad(){try{const d=await DB(),c=await rq(d.transaction('k').objectStore('k').get(CK));if(!c||c.n!==allMedia().length)return;let n=0;for(const p of P.points)for(const o of p.imgs){const x=c.m[o.id];if(x){o.e=x.e;o.v=x.v;o.m=TAG;n++}}DG.cache=n+' photos'}catch(e){}}
async function cacheSave(){if(!PUB)return;try{const d=await DB(),m={};for(const p of P.points)for(const o of p.imgs)if(o.e&&o.m===TAG)m[o.id]={e:o.e,v:o.v};d.transaction('k','readwrite').objectStore('k').put({n:allMedia().length,m},CK)}catch(e){}}
addEventListener('error',e=>lg('Error: '+(e.message||'unknown'),'er'));addEventListener('unhandledrejection',e=>lg('Error: '+((e.reason&&e.reason.message)||e.reason),'er'));
const getJSON=async u=>{try{const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();DG.src='fetch';return j}catch(e){}
 try{const j=await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('GET',u);x.onload=()=>{try{res(JSON.parse(x.responseText))}catch(e){rej(e)}};x.onerror=()=>rej(0);x.send()});DG.src='XHR';return j}catch(e){}
 const j=await new Promise((res,rej)=>{const t=document.createElement('script');t.src=u.replace(/\.json$/,'.js');t.onload=()=>window.__NAVDATA?res(window.__NAVDATA):rej(Error('data.js is empty'));t.onerror=()=>rej(Error('could not read '+u+' or data.js'));document.head.appendChild(t)});DG.src='data.js';return j};

(async()=>{const b=JSON.parse($('#bundled').textContent);if(b){PUB=true;V='live';try{P=await getJSON('data.json')}catch(e){P=blankP();toast('Could not load data.json. On a web host, upload it next to index.html. In an app, make sure data.json and the media folder were bundled with index.html.')}}else{try{await load()}catch(e){P=blankP();toast('Saved data could not be loaded: '+e.message)}}mig();if(PUB){await cacheLoad();imgTest()}else{await save();try{PL=await plist()}catch(e){PL=[]}}render();ready().then(prepP)})();
